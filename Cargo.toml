[package]
name = "lgdscan"
version = "0.2.0"
edition = "2021"
description = "Logo analysis compatible with the AviUtl logo plugin (.lgd)"
license = "GPL-3.0-only"
repository = "https://github.com/DeepRegular/LogoScan"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
encoding_rs = "0.8"
serde_json = "1"

[[bin]]
name = "lgdscan"
path = "src/main.rs"

[[bin]]
name = "lgdscan-gui"
path = "src/gui/main.rs"

[profile.release]
opt-level = 3
